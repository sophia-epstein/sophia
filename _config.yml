  business strategy, and innovation. Her work appears in Wired UK, BBC Worklife,
  GQ, Contagious, and Weapons of Reason.
url: "https://sophiaepstein.com"
baseurl: "/sophia"

author:
  name: Sophia Epstein
  email: sophia.epstein@gmail.com
