<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" class="icon-svg" aria-hidden="true" focusable="false">
  <defs>
    <filter id="r-articles" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#r-articles)">
    <!-- Back paper (rotated) -->
    <g transform="rotate(-7, 40, 48)">
      <rect x="18" y="20" width="44" height="52" rx="1" fill="var(--chrome)" stroke="var(--ink)" stroke-width="1.8"/>
    </g>
    <!-- Middle paper -->
    <g transform="rotate(4, 40, 44)">
      <rect x="16" y="14" width="44" height="52" rx="1" fill="var(--cream)" stroke="var(--ink)" stroke-width="1.8"/>
    </g>
    <!-- Front paper -->
    <rect x="14" y="8" width="48" height="58" rx="1" fill="white" stroke="var(--ink)" stroke-width="2.2"/>
    <!-- Chartreuse headline bar on front -->
    <rect x="18" y="14" width="36" height="7" rx="1" fill="var(--chartreuse)"/>
    <!-- Text lines -->
    <line x1="18" y1="27" x2="56" y2="27" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="18" y1="34" x2="52" y2="34" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="18" y1="41" x2="56" y2="41" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="18" y1="48" x2="46" y2="48" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="18" y1="55" x2="54" y2="55" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
