<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" class="icon-svg" aria-hidden="true" focusable="false">
  <defs>
    <filter id="r-mag" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#r-mag)">
    <!-- Back issue (rotated, behind) -->
    <g transform="rotate(-6, 38, 45)">
      <rect x="14" y="24" width="50" height="38" rx="1" fill="var(--chrome)" stroke="var(--ink)" stroke-width="1.8"/>
      <line x1="24" y1="24" x2="24" y2="62" stroke="var(--ink)" stroke-width="2"/>
    </g>
    <!-- Front issue -->
    <rect x="12" y="12" width="52" height="40" rx="1" fill="var(--cream)" stroke="var(--ink)" stroke-width="2.2"/>
    <!-- Spine -->
    <line x1="22" y1="12" x2="22" y2="52" stroke="var(--ink)" stroke-width="2.5"/>
    <!-- Cover image (chartreuse rectangle) -->
    <rect x="26" y="16" width="34" height="20" rx="1" fill="var(--chartreuse)" stroke="var(--ink)" stroke-width="1.5"/>
    <!-- Cover text lines -->
    <line x1="26" y1="40" x2="58" y2="40" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="26" y1="46" x2="48" y2="46" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Little abstract cover graphic in chartreuse box -->
    <circle cx="38" cy="26" r="5" fill="white" stroke="var(--ink)" stroke-width="1.3"/>
    <line x1="46" y1="22" x2="55" y2="22" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="46" y1="26" x2="55" y2="26" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="46" y1="30" x2="52" y2="30" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
