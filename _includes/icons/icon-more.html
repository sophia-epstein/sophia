      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#r-more)">
    <!-- Papers sticking out (drawn first, behind folder) -->
    <g transform="rotate(-8, 23, 26)">
      <rect x="17" y="8" width="12" height="30" rx="1" fill="white" stroke="var(--ink)" stroke-width="1.8"/>
      <line x1="20" y1="14" x2="26" y2="14" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="20" y1="18" x2="26" y2="18" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <rect x="34" y="5" width="12" height="33" rx="1" fill="white" stroke="var(--ink)" stroke-width="1.8"/>
    <line x1="37" y1="11" x2="43" y2="11" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="37" y1="15" x2="43" y2="15" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round"/>
    <g transform="rotate(7, 57, 24)">
      <rect x="51" y="8" width="12" height="28" rx="1" fill="white" stroke="var(--ink)" stroke-width="1.8"/>
      <line x1="54" y1="14" x2="60" y2="14" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <!-- Folder body (covers bottom of papers) -->
    <path d="M6 34 L6 72 L74 72 L74 34 Z" fill="var(--cream)"/>
    <!-- Folder tab -->
    <path d="M6 26 L6 34 L36 34 L40 26 Z" fill="var(--chartreuse)"/>

    <path d="M6 26 L40 26 L44 34 L74 34 L74 72 L6 72 Z" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Folder seam -->
    <line x1="6" y1="34" x2="44" y2="34" stroke="var(--ink)" stroke-width="1.5"/>
  </g>
</svg>
