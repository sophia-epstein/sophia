<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" class="icon-svg" aria-hidden="true" focusable="false">
  <defs>
    <filter id="r-copy" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#r-copy)">
    <!-- Document body -->
    <rect x="14" y="10" width="42" height="62" rx="1" fill="white" stroke="var(--ink)" stroke-width="2.2"/>
    <!-- Top strip on doc -->
    <rect x="14" y="10" width="42" height="10" fill="var(--chrome)"/>
    <line x1="14" y1="20" x2="56" y2="20" stroke="var(--ink)" stroke-width="1.5"/>
    <!-- Text lines -->
    <line x1="20" y1="28" x2="50" y2="28" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="35" x2="50" y2="35" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="42" x2="42" y2="42" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="49" x2="50" y2="49" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="20" y1="56" x2="38" y2="56" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Coral badge circle (top right, overlapping corner) -->
    <circle cx="57" cy="18" r="12" fill="var(--coral)" stroke="var(--ink)" stroke-width="2.2"/>
    <!-- Plus/cross inside badge -->
    <line x1="57" y1="12" x2="57" y2="24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="51" y1="18" x2="63" y2="18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
