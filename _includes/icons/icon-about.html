<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" class="icon-svg" aria-hidden="true" focusable="false">
  <defs>
    <filter id="r-about" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="1" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#r-about)">
    <!-- Card background -->
    <rect x="11" y="14" width="58" height="52" fill="var(--cream)"/>
    <!-- Top chartreuse strip -->
    <rect x="11" y="14" width="58" height="12" fill="var(--chartreuse)"/>
    <!-- Card border -->
    <rect x="11" y="14" width="58" height="52" fill="none" stroke="var(--ink)" stroke-width="2.2" rx="2"/>
    <!-- Divider below strip -->
    <line x1="11" y1="26" x2="69" y2="26" stroke="var(--ink)" stroke-width="1.5"/>
    <!-- Photo circle (left side) -->
    <circle cx="26" cy="44" r="9" fill="var(--chrome)" stroke="var(--ink)" stroke-width="1.8"/>
    <line x1="22" y1="40" x2="30" y2="48" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="30" y1="40" x2="22" y2="48" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Text lines (right side) -->
    <line x1="40" y1="36" x2="63" y2="36" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="43" x2="61" y2="43" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="40" y1="50" x2="56" y2="50" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Little name tag marker on strip -->
    <rect x="18" y="17" width="24" height="6" rx="1" fill="rgba(28,28,28,0.15)"/>
  </g>
</svg>
