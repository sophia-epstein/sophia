<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" class="icon-svg" aria-hidden="true" focusable="false">

    <filter id="r-contact" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>

  </defs>

    <rect x="8" y="22" width="64" height="44" rx="2" fill="var(--cream)" stroke="var(--ink)" stroke-width="2.2"/>

    <line x1="8" y1="66" x2="30" y2="48" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="72" y1="66" x2="50" y2="48" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="52" y="28" width="14" height="16" rx="1" fill="white" stroke="var(--ink)" stroke-width="1.8"/>
    <rect x="55" y="31" width="8" height="10" rx="1" fill="var(--chartreuse)" stroke="var(--ink)" stroke-width="1.2"/>
  </g>
</svg>
